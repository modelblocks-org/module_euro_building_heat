# Minimal example configuration for the heat demand workflow.
years:
  # End year is exclusive, matching the Modelblocks module convention.
  start: 2023
  end: 2024

weather:
  # Weather years used to shape hourly heat demand profiles. End year is exclusive.
  start: 2018
  end: 2019

threads:
  aggregation: 8

population:
  # GHSL GHS-POP resolution in metres. 100 m is the most precise available
  # Mollweide grid; use 100 for a heavier, longer download.
  resolution: 1000

# FIXME: Still GBR as a proxy is breaking so update later. 
data_proxies:
  annual_energy_balance:
    AND: [ESP]
    LIE: [CHE]
    MCO: [FRA]
    SMR: [ITA]
  household_end_use:
    AND: [ESP]
    ISL: [SWE, DNK]
    LIE: [CHE]
    MCO: [FRA]
    SMR: [ITA]
  jrc_idees:
    ALB: [BGR, HRV, HUN, ROU, GRC]
    AND: [ESP]
    BIH: [BGR, HRV, HUN, ROU, GRC]
    ISL: [SWE, DNK]
    LIE: [CHE]
    MKD: [BGR, HRV, HUN, ROU, GRC]
    MCO: [FRA]
    MNE: [BGR, HRV, HUN, ROU, GRC]
    NOR: [SWE, DNK]
    SMR: [ITA]
    SRB: [BGR, HRV, HUN, ROU, GRC]

scaling:
  # Convert MWh to the power unit expected by the downstream model.
  power: 0.00001

heat:
  tech_efficiencies:
    space_heat:
      gas-eff: 0.97
      oil-eff: 0.9
      solid-fossil-eff: 0.8
      biofuel-eff: 0.8
      solar-thermal-eff: 1
      electricity-eff: 1
    hot_water:
      gas-eff: 0.97
      oil-eff: 0.9
      solid-fossil-eff: 0.8
      biofuel-eff: 0.8
      solar-thermal-eff: 1
      electricity-eff: 1
    cooking:
      gas-eff: 0.28
      oil-eff: 0.28
      solid-fossil-eff: 0.15
      biofuel-eff: 0.1
      electricity-eff: 0.5
  sfh_mfh_shares:
    MFH: 0.45
    SFH: 0.55
