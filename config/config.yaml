# Minimal example configuration for the heat demand workflow.
years:
  # End year is exclusive, matching the Modelblocks module convention.
  start: 2023
  end: 2024

weather:
  # Weather years used to shape hourly heat demand profiles. End year is exclusive.
  start: 2018
  end: 2019

threads:
  aggregation: 8

population:
  # GHSL GHS-POP resolution in metres. 100 m is the most precise available
  # Mollweide grid; use 100 for a heavier, longer download.
  resolution: 1000

data_proxies:
# Use proxies to fill missing data for countries with no or incomplete data.
# Multiple proxy countries can be specified for a single country, in which case the data from the proxy countries will be averaged.
  # annual_energy_balance uses energy balance data from the proxy country and scales with population.
  annual_energy_balance:
    AND: [ESP]
    LIE: [CHE]
    MCO: [GBR]
    SMR: [ITA]
  # household_end_use uses household end use data from the proxy country to scale annual energy balance data.
  household_end_use:
    AND: [ESP]
    ISL: [SWE, DNK]
    LIE: [CHE]
    MCO: [GBR]
    SMR: [ITA]
  # jrc_idees uses the JRC IDEES dataset from the proxy country to shape hourly profiles.
  jrc_idees:
    ALB: [BGR, HRV, HUN, ROU, GRC]
    AND: [ESP]
    BIH: [BGR, HRV, HUN, ROU, GRC]
    ISL: [SWE, DNK]
    LIE: [CHE]
    MKD: [BGR, HRV, HUN, ROU, GRC]
    MCO: [GBR]
    MNE: [BGR, HRV, HUN, ROU, GRC]
    NOR: [SWE, DNK]
    SMR: [ITA]
    SRB: [BGR, HRV, HUN, ROU, GRC]


heat:
  # Use published JRC-IDEES useful heat where available (actual), or convert all
  # countries from final energy with the efficiencies below (calculate_all).
  useful_heat_demand: actual
  tech_efficiencies:
    space_heat:
      gas-eff: 0.97
      oil-eff: 0.9
      solid-fossil-eff: 0.8
      biofuel-eff: 0.8
      solar-thermal-eff: 1
      electricity-eff: 1
    hot_water:
      gas-eff: 0.97
      oil-eff: 0.9
      solid-fossil-eff: 0.8
      biofuel-eff: 0.8
      solar-thermal-eff: 1
      electricity-eff: 1
    cooking:
      gas-eff: 0.28
      oil-eff: 0.28
      solid-fossil-eff: 0.15
      biofuel-eff: 0.1
      electricity-eff: 0.5
  sfh_mfh_shares:
    MFH: 0.45
    SFH: 0.55
  heat_pump:
    sink_temperature:
      underfloor: 35
      radiator_large: 50
      radiator_conventional: 65
      hot_water: 60
    space_heat_sink_shares:
      underfloor: 0.1
      radiator_large: 0.15
      radiator_conventional: 0.75
    heat_pump_shares:
      ashp: 0.9
      gshp: 0.1
    correction_factor: 0.85
