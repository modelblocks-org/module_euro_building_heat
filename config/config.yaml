building_rasters:
  source: prebuilt
  # Building_raster settings below apply only to rebuild; prebuilt uses published grids.
  processing:
    nuts3_batches: 128

  buildings_microsoft:
    footprint_allocation_threshold_cells: 1.0
    release: '2026-08-13'
    minimum_building_count: 2000

  buildings_eubucco:
    footprint_allocation_threshold_cells: 1.0
    quality_control:
      repair_height_floors: true
      minimum_height_per_floor_m: 1.5
      reference_floor_height_m: 4.17
      source_priority: [estimated, osm, gov, msft]
      maximum_regional_floor_area_share: 0.01
    floor_bin_representatives:
      n_floors_0_2: 1
      n_floors_2_4: 3
      n_floors_4_7: 5.5
      n_floors_7_inf: 9

  eurostat:
    useful_to_gross_ratio: 1.2
    floor_space_m2:
      SQM_LT30: 25
      SQM30-39: 35
      SQM40-49: 45
      SQM50-59: 55
      SQM60-79: 70
      SQM80-99: 90
      SQM100-119: 110
      SQM120-149: 135
      SQM_GE150: 180
    rooms:
      GE9: 10
    floor_area_per_room_m2: 20

