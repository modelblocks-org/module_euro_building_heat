# Minimal example configuration for the heat demand workflow.
years:
  # End year is exclusive, matching the Modelblocks module convention.
  start: 2020
  end: 2021

weather:
  # Weather data year used to shape hourly heat demand profiles.
  year: 2018

threads:
  aggregation: 8

population:
  # GHSL GHS-POP resolution in metres. 100 m is the most precise available
  # Mollweide grid; use 1000 for a smaller, faster download.
  resolution: 1000

scaling:
  # Convert MWh to the power unit expected by the downstream model.
  power: 0.00001

heat:
  tech_efficiencies:
    space_heat:
      gas-eff: 0.97
      oil-eff: 0.9
      solid-fossil-eff: 0.8
      biofuel-eff: 0.8
      solar-thermal-eff: 1
      electricity-eff: 1
    hot_water:
      gas-eff: 0.97
      oil-eff: 0.9
      solid-fossil-eff: 0.8
      biofuel-eff: 0.8
      solar-thermal-eff: 1
      electricity-eff: 1
    cooking:
      gas-eff: 0.28
      oil-eff: 0.28
      solid-fossil-eff: 0.15
      biofuel-eff: 0.1
      electricity-eff: 0.5
  sfh_mfh_shares:
    MFH: 0.45
    SFH: 0.55
