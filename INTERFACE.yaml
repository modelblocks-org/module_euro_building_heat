# Module Input-Output structure for automated docs generation
pathvars:
  snakemake_defaults:
    logs:
      default: "<logs>"
      description: location of snakemake log files.
    resources:
      default: "<resources>"
      description: location of module resource/input files.
    results:
      default: "<results>"
      description: location of module result/output files.
  user_resources:
    shapes:
      default: "<resources>/user/{shapes}/shapes.parquet"
      description: |
        Region-specific polygons to process. The parquet file must include
        `shape_id`, `country_id` (ISO alpha-3), `shape_class`, and `geometry`
        columns. Only rows with `shape_class` set to `land` are processed.
  results:
    annual_heat_demand:
      default: "<results>/{shapes}/annual/heat_demand_twh.parquet"
      description: Annual useful heat demand in TWh, scaled from countries to shapes.
    heat_demand:
      default: "<results>/{shapes}/aggregated/heat_demand.parquet"
      description: Shape-aggregated heat demand time series.
    heat_pump_cop:
      default: "<results>/{shapes}/aggregated/heat_pump_cop.parquet"
      description: Shape-aggregated heat-pump coefficient of performance time series.
    heat_pump_electricity_demand:
      default: "<results>/{shapes}/aggregated/heat_pump_electricity_demand.parquet"
      description: Shape-aggregated electricity demand time series for heat supplied by heat pumps.
    heat_demand_visualization:
      default: "<results>/{shapes}/visualization/heat_demand.html"
      description: Interactive choropleth map for visually checking heat demand time series.
wildcards:
  shapes: name of the provided shapes case.
