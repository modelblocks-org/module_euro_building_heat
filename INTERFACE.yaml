# Module Input-Output structure for automated docs generation
convention_version: v1.0.0

pathvars:
  snakemake_defaults:
    logs:
      default: "<logs>"
      description: location of snakemake log files.
    resources:
      default: "<resources>"
      description: "location of module resource (input) files."
    results:
      default: "<results>"
      description: "location of module result (output) files."
  user_resources:
    edh_api:
      default: "<resources>/user/edh_api.txt"
      description: |
        Earth Data Hub API key used to download ERA5 weather data. The file
        must contain only the API key; surrounding whitespace is ignored.
    shapes:
      default: "<resources>/user/{shapes}/shapes.parquet"
      description: |
        Region-specific polygons to process. The parquet file must include
        `shape_id`, `country_id` (ISO alpha-3), `shape_class`, and `geometry`
        columns. Only rows with `shape_class` set to `land` are processed.
  results:
    annual_heat_demand:
      default: "<results>/{shapes}/annual/heat_demand_twh.parquet"
      description: Annual useful heat demand in TWh, scaled from countries to shapes.
    heat_demand:
      default: "<results>/{shapes}/aggregated/heat_demand.parquet"
      description: Shape-aggregated heat demand with a UTC-aware hourly index; local When2Heat behavior is converted using geometry-derived IANA timezones.
    heat_pump_cop:
      default: "<results>/{shapes}/aggregated/heat_pump_cop.parquet"
      description: Shape-aggregated heat-pump coefficient of performance with a UTC-aware hourly index.
    heat_pump_electricity_demand:
      default: "<results>/{shapes}/aggregated/heat_pump_electricity_demand.parquet"
      description: Shape-aggregated electricity demand for heat pumps with the same UTC-aware hourly index as heat demand and COP.
    annual_heat_demand_choropleth:
      default: "<results>/{shapes}/visualization/annual_heat_demand.pdf"
      description: Static choropleth of annual useful heat demand by shape.
    heat_demand_timeseries:
      default: "<results>/{shapes}/visualization/heat_demand_timeseries.pdf"
      description: Static hourly heat-demand time series with one subplot per shape.
wildcards:
  shapes: name of the provided shapes case.
