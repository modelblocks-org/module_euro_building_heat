# Module Input-Output structure for automated docs generation
convention_version: v1.0.0

pathvars:
  snakemake_defaults:
    logs:
      default: "<logs>"
      description: location of snakemake log files.
    resources:
      default: "<resources>"
      description: "location of module resource (input) files."
    results:
      default: "<results>"
      description: "location of module result (output) files."
  user_resources:
    edh_api:
      default: "<resources>/user/edh_api.txt"
      description: |
        Earth Data Hub API key used to download ERA5 weather data.
        The file must contain only the API key.
    shapes:
      default: "<resources>/user/{shapes}/shapes.parquet"
      description: |
        Region-specific polygons to process.
        The parquet file must include the following columns:
        `shape_id`, `country_id` (ISO alpha-3), `shape_class`, and `geometry`.
        Only rows with `shape_class` set to `land` are processed.
  results:
    annual_heat_demand:
      default: "<results>/{shapes}/annual/heat_demand_twh.parquet"
      description: |
        Annual useful heat demand in TWh, scaled from countries to shapes.
        This table contains `end_use`, `category`, `year`, `shape_id`,
        and `heat_demand_twh` columns.
    heat_demand:
      default: "<results>/{shapes}/hourly/heat_demand_mwh.parquet"
      description: |
        Shape-aggregated heat demand in MWh with a UTC hourly index.
        Localised When2Heat behavior is converted using geometry-derived IANA timezones.
    heat_pump_cop:
      default: "<results>/{shapes}/hourly/heat_pump_cop_pu.parquet"
      description: >
        Shape-aggregated heat-pump coefficient of performance in p.u. with a UTC hourly index.
    heat_pump_electricity_demand:
      default: "<results>/{shapes}/hourly/heat_pump_electricity_demand_mwh.parquet"
      description: >
        Shape-aggregated electricity demand for heat pumps in MWh with the same
        UTC hourly index as the COP file.
wildcards:
  shapes: name of the provided shapes case.
