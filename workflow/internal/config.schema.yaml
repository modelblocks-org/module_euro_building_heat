$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for user-provided heat demand configuration."
type: object
additionalProperties: false
required:
  - years
  - weather
  - threads
  - scaling
  - heat
properties:
  years:
    type: object
    additionalProperties: false
    required: [start, end]
    properties:
      start:
        type: integer
        minimum: 2010
        maximum: 2023
      end:
        type: integer
        minimum: 2011
        maximum: 2024
  weather:
    type: object
    additionalProperties: false
    required: [start, end]
    properties:
      start:
        type: integer
      end:
        type: integer
  threads:
    type: object
    additionalProperties: false
    required: [aggregation]
    properties:
      aggregation:
        type: integer
        minimum: 1
  population:
    type: object
    additionalProperties: false
    properties:
      resolution:
        type: integer
        enum: [100, 1000]
  data_proxies:
    type: object
    additionalProperties: false
    properties:
      annual_energy_balance:
        $ref: "#/$defs/country_proxy_map"
      household_end_use:
        $ref: "#/$defs/country_proxy_map"
      jrc_idees:
        $ref: "#/$defs/country_proxy_map"
  scaling:
    type: object
    additionalProperties: false
    required: [power]
    properties:
      power:
        type: number
        exclusiveMinimum: 0
  heat:
    type: object
    additionalProperties: false
    required: [tech_efficiencies, sfh_mfh_shares]
    properties:
      tech_efficiencies:
        type: object
        additionalProperties:
          type: object
          additionalProperties:
            type: number
      sfh_mfh_shares:
        type: object
        additionalProperties: false
        required: [MFH, SFH]
        properties:
          MFH:
            type: number
            minimum: 0
            maximum: 1
          SFH:
            type: number
            minimum: 0
            maximum: 1
$defs:
  country_proxy_map:
    type: object
    additionalProperties:
      type: array
      minItems: 1
      items:
        type: string
        pattern: "^[A-Za-z]{3}$"
