$schema: https://json-schema.org/draft/2020-12/schema
description: Schema for user-provided heat demand configuration.
type: object
additionalProperties: false
required:
- demand_years
- weather_years
- threads
- population
- crs
- processing
- buildings_microsoft
- buildings_eubucco
- eurostat
- raster
- plotting
- data_proxies
- spatial_weights
- useful_heat_demand
- tech_efficiencies
- heat_pump
properties:
  building_rasters:
    description: "Settings controlling whether building grids are downloaded or rebuilt."
    type: object
    additionalProperties: false
    required:
    - source
    properties:
      source:
        type: string
        enum:
        - auto
        - rebuild
        description: Download published grids for matching settings, or always rebuild.
  demand_years:
    description: |
      Selects the annual heat-demand years. The range includes `start` and excludes
      `end`.
    type: object
    additionalProperties: false
    required:
    - start
    - end
    properties:
      start:
        description: "First annual heat-demand year, included in the range."
        type: integer
        minimum: 2010
        maximum: 2023
      end:
        description: "End of the annual heat-demand year range, excluded from the range."
        type: integer
        minimum: 2011
        maximum: 2024
  weather_years:
    description: |
      Selects the ERA5 years used to construct hourly profiles. The range includes
      `start`, excludes `end`, and must span the same number of years as `demand_years`;
      weather and demand years are paired in order.
    type: object
    additionalProperties: false
    required:
    - start
    - end
    properties:
      start:
        description: "First ERA5 weather year, included in the range."
        type: integer
      end:
        description: "End of the ERA5 weather year range, excluded from the range."
        type: integer
  threads:
    description: Settings controlling parallel execution of aggregation tasks.
    type: object
    additionalProperties: false
    required:
    - aggregation
    properties:
      aggregation:
        description: |
          Maximum number of worker threads used to calculate and aggregate gridded
          heat-demand and heat-pump profiles.
        type: integer
        minimum: 1
  population:
    description: "Population dataset and processing settings for gridded aggregation."
    type: object
    additionalProperties: false
    required:
    - epoch
    - chunk_size
    properties:
      epoch:
        description: "Reference year of the gridded population dataset."
        type: integer
        enum:
        - 1975
        - 1980
        - 1985
        - 1990
        - 1995
        - 2000
        - 2005
        - 2010
        - 2015
        - 2020
        - 2025
        - 2030
      chunk_size:
        description: "Aggregation window width and height in pixels; larger windows use more memory."
        type: integer
        minimum: 256
        multipleOf: 256
  crs:
    description: Coordinate reference systems used for geometry calculations.
    type: object
    additionalProperties: false
    required:
    - projected
    properties:
      projected:
        description: |
          Projected CRS used for centroid calculations, supplied as a CRS string such as
          EPSG:3035 or as an integer EPSG code such as 3035.
        oneOf:
        - type: string
        - type: integer
  data_proxies:
    description: |
      Optional mappings from unsupported target countries to reference countries. Values
      from multiple reference countries are averaged.
    type: object
    additionalProperties: false
    properties:
      sfh_mfh_shares:
        description: |
          Maps countries missing dwelling-type data to countries whose single-family homes
          (sfh) and multi-family homes (mfh) shares should be averaged.
        $ref: '#/$defs/country_proxy_map'
      annual_energy_balance:
        description: |
          Maps countries missing energy-balance data to countries whose per-capita energy
          intensities should be averaged and scaled to the target population.
        $ref: '#/$defs/country_proxy_map'
      household_end_use:
        description: |
          Maps countries missing residential end-use data to countries whose carrier-level
          household end-use shares should be averaged.
        $ref: '#/$defs/country_proxy_map'
      jrc_idees:
        description: |
          Maps countries missing commercial end-use data to JRC-IDEES countries whose
          carrier-level services end-use shares should be averaged.
        $ref: '#/$defs/country_proxy_map'
      floor_area:
        description: "Reference-country settings for missing floor-area and building-count data."
        type: object
        additionalProperties: false
        required:
        - countries
        properties:
          countries:
            description: "Maps target countries to reference countries for floor-area and building-count proxies."
            $ref: '#/$defs/country_proxies'
    required:
    - floor_area
  spatial_weights:
    description: "Settings for spatial allocation of annual space-heating demand."
    type: object
    additionalProperties: false
    required:
    - population
    - surface_volume
    - age
    properties:
      population:
        description: "Population contribution to residential structural heat-demand weights."
        type: object
        additionalProperties: false
        required:
        - share
        properties:
          share:
            description: "Population fraction of the residential blend; zero uses floor area and one uses population."
            type: number
            minimum: 0
            maximum: 1
      surface_volume:
        description: "Building compactness correction for residential space-heating weights."
        type: object
        additionalProperties: false
        required:
        - elasticity
        - method
        properties:
          elasticity:
            description: "Exponent applied to the surface-to-volume ratio before country centring; zero is neutral."
            type: number
            minimum: 0
          method:
            description: "Perimeter estimation method; footprint_perimeter uses observed geometry and requires full EUBUCCO."
            type: string
            enum:
            - equivalent_square
            - footprint_perimeter
      age:
        description: "Building-age corrections centred on each country's floor-area-weighted mean."
        type: object
        additionalProperties: false
        required:
        - multipliers
        - cutoff_spanning_bin_multipliers
        properties:
          multipliers:
            description: "Relative heat intensities by construction period; setting all factors to one is neutral."
            type: object
            additionalProperties: false
            required:
            - before_1991
            - '1991_2000'
            - after_2000
            properties:
              before_1991:
                description: "Relative heat intensity for dwellings built before 1991."
                type: number
                exclusiveMinimum: 0
              '1991_2000':
                description: "Relative heat intensity for dwellings built from 1991 through 2000."
                type: number
                exclusiveMinimum: 0
              after_2000:
                description: "Relative heat intensity for dwellings built after 2000."
                type: number
                exclusiveMinimum: 0
          cutoff_spanning_bin_multipliers:
            description: "Separate heat-intensity factors for census bins spanning the 1991 cutoff."
            type: object
            additionalProperties: false
            required:
            - Y1981-2000
            properties:
              Y1981-2000:
                description: "Relative heat intensity for dwellings reported in the combined 1981-2000 census bin."
                type: number
                exclusiveMinimum: 0
      hdd:
        description: Annual household and commercial space-heating severity correction from
          ERA5.
        type: object
        additionalProperties: false
        default: {}
        properties:
          base_temperature:
            description: HDD base temperature in degrees Celsius, using daily mean temperature.
            type: number
            default: 15.5
          elasticity:
            description: |
              Exponent applied to HDD before country-normalised sector space-heat allocation.
              Zero disables the correction.
            type: number
            minimum: 0
            default: 0.5
  useful_heat_demand:
    description: |
      Chooses whether to use published useful-heat data where available (`actual`) or
      calculate all useful heat from final energy and `tech_efficiencies`
      (`calculate_all`).
    type: string
    enum:
    - actual
    - calculate_all
    default: actual
  tech_efficiencies:
    description: |
      Final-to-useful energy conversion factors grouped by end use and carrier; for
      example, 0.9 converts one unit of final energy to 0.9 units of useful heat.
    type: object
    additionalProperties: false
    properties:
      space_heat:
        description: Conversion factors for space heating.
        $ref: '#/$defs/technology_efficiencies'
      hot_water:
        description: Conversion factors for hot water.
        $ref: '#/$defs/technology_efficiencies'
      cooking:
        description: Conversion factors for cooking.
        $ref: '#/$defs/technology_efficiencies'
  heat_pump:
    description: |
      Settings used to calculate the combined air-source and ground-source heat-pump
      coefficient-of-performance profile.
    type: object
    additionalProperties: false
    required:
    - sink_temperature
    - space_heat_sink_shares
    - heat_pump_shares
    - correction_factor
    properties:
      sink_temperature:
        description: |
          Operating temperature in degrees Celsius for each heat-delivery method. Exactly
          one method omitted from `space_heat_sink_shares` is treated as the hot-water sink.
        type: object
        minProperties: 2
        additionalProperties:
          description: Sink operating temperature in degrees Celsius.
          type: number
      space_heat_sink_shares:
        description: |
          Share of space heat delivered by each configured sink method. Keys must occur in
          `sink_temperature`, and values must sum to one.
        type: object
        minProperties: 1
        additionalProperties:
          description: Fraction of space heat delivered by this sink method.
          type: number
          minimum: 0
          maximum: 1
      heat_pump_shares:
        description: |
          Shares of air-source and ground-source heat pumps used to form the combined COP
          profile; the two values must sum to one.
        type: object
        additionalProperties: false
        required:
        - ashp
        - gshp
        properties:
          ashp:
            description: Fraction of heat pumps that are air-source.
            type: number
            minimum: 0
            maximum: 1
          gshp:
            description: Fraction of heat pumps that are ground-source.
            type: number
            minimum: 0
            maximum: 1
      correction_factor:
        description: |
          Positive multiplier applied to manufacturer COP curves to represent expected
          operational performance.
        type: number
        exclusiveMinimum: 0
  processing:
    description: "Batching settings for building-data processing."
    type: object
    additionalProperties: false
    required:
    - nuts3_batches
    properties:
      nuts3_batches:
        description: "Number of balanced regional batches used to process buildings."
        type: integer
        minimum: 1
  buildings_microsoft:
    description: "Microsoft building-footprint release and population-fallback settings."
    type: object
    additionalProperties: false
    required:
    - release
    - minimum_building_count
    properties:
      release:
        description: "Dated Microsoft building-footprint release to download and cache, in YYYY-MM-DD format."
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      minimum_building_count:
        description: "Tiles with fewer retained buildings use population-based fallback."
        type: integer
        minimum: 0
  buildings_eubucco:
    description: "EUBUCCO building source and representative storey-count assumptions."
    type: object
    additionalProperties: false
    required:
    - source
    - floor_bin_representatives
    properties:
      source:
        description: "Building dataset variant; full includes observed perimeters and lightweight requires equivalent_square."
        type: string
        enum:
        - lightweight
        - full
      floor_bin_representatives:
        description: "Representative storey counts used to estimate mean storeys and missing floor-area totals."
        type: object
        additionalProperties: false
        required:
        - n_floors_0_2
        - n_floors_2_4
        - n_floors_4_7
        - n_floors_7_inf
        properties:
          n_floors_0_2:
            description: "Representative storey count for the 0-2 floor bin."
            type: number
            exclusiveMinimum: 0
          n_floors_2_4:
            description: "Representative storey count for the 2-4 floor bin."
            type: number
            exclusiveMinimum: 0
          n_floors_4_7:
            description: "Representative storey count for the 4-7 floor bin."
            type: number
            exclusiveMinimum: 0
          n_floors_7_inf:
            description: "Representative storey count for the 7 or more floor bin."
            type: number
            exclusiveMinimum: 0
  eurostat:
    description: "Census dwelling-area and room-count assumptions used to estimate residential floor area."
    type: object
    additionalProperties: false
    required:
    - useful_to_gross_ratio
    - floor_space_m2
    - rooms
    - floor_area_per_room_m2
    properties:
      useful_to_gross_ratio:
        description: "Multiplier converting useful dwelling floor area to gross building area, including walls and shared space."
        type: number
        exclusiveMinimum: 0
      floor_space_m2:
        description: "Representative useful floor area in m\xB2 per dwelling in each Census\
          \ 2021 area class."
        type: object
        additionalProperties: false
        required:
        - SQM_LT30
        - SQM30-39
        - SQM40-49
        - SQM50-59
        - SQM60-79
        - SQM80-99
        - SQM100-119
        - SQM120-149
        - SQM_GE150
        properties:
          SQM_LT30:
            description: "Representative useful floor area in square metres for dwellings in the less than 30 square metre class."
            type: number
            exclusiveMinimum: 0
          SQM30-39:
            description: "Representative useful floor area in square metres for dwellings in the 30-39 square metre class."
            type: number
            exclusiveMinimum: 0
          SQM40-49:
            description: "Representative useful floor area in square metres for dwellings in the 40-49 square metre class."
            type: number
            exclusiveMinimum: 0
          SQM50-59:
            description: "Representative useful floor area in square metres for dwellings in the 50-59 square metre class."
            type: number
            exclusiveMinimum: 0
          SQM60-79:
            description: "Representative useful floor area in square metres for dwellings in the 60-79 square metre class."
            type: number
            exclusiveMinimum: 0
          SQM80-99:
            description: "Representative useful floor area in square metres for dwellings in the 80-99 square metre class."
            type: number
            exclusiveMinimum: 0
          SQM100-119:
            description: "Representative useful floor area in square metres for dwellings in the 100-119 square metre class."
            type: number
            exclusiveMinimum: 0
          SQM120-149:
            description: "Representative useful floor area in square metres for dwellings in the 120-149 square metre class."
            type: number
            exclusiveMinimum: 0
          SQM_GE150:
            description: "Representative useful floor area in square metres for dwellings in the 150 or more square metre class."
            type: number
            exclusiveMinimum: 0
      rooms:
        description: "Representative room count for dwellings reported as nine or more rooms;\
          \ exact counts 1\u20138 are fixed."
        type: object
        additionalProperties: false
        required:
        - GE9
        properties:
          GE9:
            description: "Representative room count for dwellings with nine or more rooms."
            type: number
            minimum: 9
      floor_area_per_room_m2:
        description: "Useful floor area in square metres per room when dwelling floor-space totals are missing or zero."
        type: number
        exclusiveMinimum: 0
  raster:
    description: "GeoTIFF storage settings for output grids."
    type: object
    additionalProperties: false
    required:
    - dtype
    - compression
    - block_size
    properties:
      dtype:
        description: "Raster numeric data type; float32 reduces storage and float64 retains more precision."
        type: string
        enum:
        - float32
        - float64
      compression:
        description: "Lossless compression algorithm used for output GeoTIFFs."
        type: string
        enum:
        - deflate
        - lzw
        - zstd
      block_size:
        description: "GeoTIFF tile width and height in pixels; must be a multiple of 16."
        type: integer
        minimum: 16
        multipleOf: 16
  plotting:
    description: "Raster preview and boundary styling settings."
    type: object
    additionalProperties: false
    required:
    - max_size
    - outline
    properties:
      max_size:
        description: "Maximum raster preview dimension in pixels."
        type: integer
        minimum: 1
      outline:
        description: "Boundary outline styling for plots."
        type: object
        additionalProperties: false
        required:
        - color
        - linewidth
        properties:
          color:
            description: "Boundary colour accepted by Matplotlib."
            type: string
          linewidth:
            description: "Boundary line width in points."
            type: number
            exclusiveMinimum: 0
$defs:
  technology_efficiencies:
    description: "Final-to-useful energy conversion factors by energy carrier."
    type: object
    additionalProperties: false
    properties:
      gas:
        description: Final-to-useful energy conversion factor for gas.
        type: number
        minimum: 0
      oil:
        description: Final-to-useful energy conversion factor for oil.
        type: number
        minimum: 0
      solid_fossil:
        description: Final-to-useful energy conversion factor for solid fossil fuels.
        type: number
        minimum: 0
      biowaste:
        description: Final-to-useful energy conversion factor for biomass and waste.
        type: number
        minimum: 0
      solar_thermal:
        description: Final-to-useful energy conversion factor for solar thermal energy.
        type: number
        minimum: 0
      electricity:
        description: Final-to-useful energy conversion factor for electricity.
        type: number
        minimum: 0
  country_proxy_map:
    description: |
      Maps each target ISO 3166-1 alpha-3 country code to one or more reference country
      codes whose relevant values will be averaged.
    type: object
    additionalProperties:
      description: Reference countries to use for one target country.
      type: array
      minItems: 1
      items:
        description: Reference-country ISO 3166-1 alpha-3 code.
        type: string
        pattern: ^[A-Za-z]{3}$
  country_proxies:
    description: "Maps uppercase target ISO alpha-3 country codes to reference-country lists."
    type: object
    propertyNames:
      description: "Target-country ISO 3166-1 alpha-3 code in uppercase."
      pattern: ^[A-Z]{3}$
    additionalProperties:
      description: "Reference countries used for one target country."
      type: array
      minItems: 1
      uniqueItems: true
      items:
        description: "Reference-country ISO 3166-1 alpha-3 code in uppercase."
        type: string
        pattern: ^[A-Z]{3}$
allOf:
- if:
    properties:
      spatial_weights:
        properties:
          surface_volume:
            properties:
              method:
                const: footprint_perimeter
  then:
    properties:
      buildings_eubucco:
        properties:
          source:
            const: full
