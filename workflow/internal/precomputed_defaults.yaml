# Frozen scientific settings for the published grids; do not derive from user defaults.
# Fixed invariants are documented in config/README.md. HDD is downstream.
population:
  epoch: 2025
buildings_eubucco:
  source: full
  floor_bin_representatives:
    n_floors_0_2: 1
    n_floors_2_4: 3
    n_floors_4_7: 5.5
    n_floors_7_inf: 9
buildings_microsoft:
  release: '2026-08-13'
  minimum_building_count: 2000
eurostat:
  useful_to_gross_ratio: 1.2
  floor_space_m2:
    SQM_LT30: 25
    SQM30-39: 35
    SQM40-49: 45
    SQM50-59: 55
    SQM60-79: 70
    SQM80-99: 90
    SQM100-119: 110
    SQM120-149: 135
    SQM_GE150: 180
  rooms:
    GE9: 10
  floor_area_per_room_m2: 20
raster:
  dtype: float32
  compression: deflate
  block_size: 512
spatial_weights:
  population:
    share: 0.5
  surface_volume:
    elasticity: 0.33
    method: footprint_perimeter
  age:
    multipliers:
      before_1991: 1.25
      '1991_2000': 1.0
      after_2000: 0.8
    cutoff_spanning_bin_multipliers:
      Y1981-2000: 1.125
data_proxies:
  floor_area:
    method: mean_floors
    countries:
      GBR: [IRL]
      ALB: [BGR, HRV, HUN, ROU, GRC]
      AND: [ESP]
      BIH: [BGR, HRV, HUN, ROU, GRC]
      ISL: [SWE, DNK]
      LIE: [CHE]
      MKD: [BGR, HRV, HUN, ROU, GRC]
      MCO: [FRA]
      MNE: [BGR, HRV, HUN, ROU, GRC]
      NOR: [SWE, DNK]
      SMR: [ITA]
      SRB: [BGR, HRV, HUN, ROU, GRC]
      XKX: [BGR, HRV, HUN, ROU, GRC]
      BRA: [PRT]
      LBR: [PRT]
