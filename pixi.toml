[workspace]
name = "module_euro_building_heat"
authors = ["See AUTHORS file"]
description = "This module prepares time series of heat demand and heat supply technologies for buildings in European countries."
license = "Apache-2.0"
readme = "README.md"
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-arm64"]
homepage = "https://www.modelblocks.org/"

[dependencies]
clio-tools = ">=2026.03.30"
conda = ">=25.0.0"
ipdb = ">=0.13.13"
ipykernel = ">=6.29.5"
jsonschema = ">=4.0.0"
mypy = ">=1.15.0"
pytest = ">=8.3.5"
python = ">=3.12"
ruff = ">=0.9.9"
snakefmt = ">=0.10.2"
snakemake-minimal = ">=9.19.0"
pytz = ">=2026.1.post1"
pyarrow = ">=24.0.0,<25"

[tasks]
test-integration = {cmd = "pytest tests/integration_test.py"}

[feature."heat-demand"]
channels = ["conda-forge", "bioconda", "nodefaults"]

[feature."heat-demand".dependencies]
bottleneck = "1.6.0.*"
cfgrib = "0.9.15.1.*"
dask = "2026.6.0.*"
eccodes = "2.46.0.*"
fiona = "1.10.1.*"
gdal = "3.10.2.*"
geopandas = "1.0.1.*"
ipdb = "0.13.13.*"
jinja2 = "3.1.6.*"
netcdf4 = "1.7.2.*"
networkx = "3.4.2.*"
numpy = "2.2.4.*"
openpyxl = "3.1.5.*"
pandas = "2.2.3.*"
pyarrow = "19.0.1.*"
pycountry = "24.6.1.*"
python = "3.12.9.*"
rasterio = "1.4.3.*"
rasterstats = "0.20.0.*"
rioxarray = "0.18.2.*"
scipy = "1.15.2.*"
shapely = "2.0.7.*"
xarray = "2025.1.2.*"
xlrd = "2.0.2.*"
pandera = "0.31.1.*"
pandera-geopandas = "0.31.1.*"
pandera-pandas = "0.31.1.*"

[feature."heat-demand".pypi-dependencies]
gregor = { git = "https://github.com/jnnr/gregor.git", rev = "main" }

[feature.shell]
channels = ["conda-forge", "bioconda", "nodefaults"]

[feature.shell.dependencies]
python = "3.12.9.*"
cdsapi = "0.7.7.*"
curl = "8.20.0.*"
fiona = "1.10.1.*"
gdal = "3.10.2.*"
geopandas = "1.0.1.*"
numpy = "2.2.4.*"
pandas = "2.2.3.*"
pyarrow = "19.0.1.*"
shapely = "2.0.7.*"

[environments]
heat-demand = { features = ["heat-demand"], no-default-feature = true }
shell = { features = ["shell"], no-default-feature = true }
